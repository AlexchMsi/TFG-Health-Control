networks:
  ot-health-net:
    driver: bridge

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:
  ollama_data:

services:

  # ── Time-series database ───────────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    networks: [ot-health-net]
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Dashboards & alerting ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: grafana
    restart: unless-stopped
    networks: [ot-health-net]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    depends_on:
      influxdb:
        condition: service_healthy

  # ── Local LLM ───────────────────────────────────────────────────────────────
  ollama:
    # Pinned version (validated locally). In an air-gapped OT deployment the
    # image must be pre-loaded with `docker save` / `docker load` and the model
    # preloaded in the ollama_data volume (`ollama pull llama3.1:8b` beforehand).
    image: ollama/ollama:0.30.7
    container_name: ollama
    restart: unless-stopped
    networks: [ot-health-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # The image ships no curl/wget; the ollama binary doubles as the probe.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── SNMP test target (local dev only — simulates a Windows host via snmpd) ──
  snmpd-sim:
    image: alpine:3.19
    container_name: snmpd-sim
    restart: unless-stopped
    networks: [ot-health-net]
    ports:
      - "1161:1161/udp"
    command: >
      sh -c "apk add --no-cache net-snmp net-snmp-tools 2>/dev/null &&
             snmpd -f -Lo udp:0.0.0.0:1161"

  # ── Server / VMware agent (Phase 1) ───────────────────────────────────────
  server-agent:
    build:
      context: .
      dockerfile: agents/server-agent/Dockerfile
    container_name: server-agent
    restart: unless-stopped
    networks: [ot-health-net]
    env_file: .env
    environment:
      - API_URL=http://health-api:8000
    depends_on:
      influxdb:
        condition: service_healthy
      api:
        condition: service_started

  # ── REST API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: health-api
    restart: unless-stopped
    networks: [ot-health-net]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
    depends_on:
      influxdb:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ── AI recommendations ─────────────────────────────────────────────────────
  recommendation-agent:
    build:
      context: .
      dockerfile: agents/recommendation-agent/Dockerfile
    container_name: recommendation-agent
    restart: unless-stopped
    networks: [ot-health-net]
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
    depends_on:
      influxdb:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ── Phase 2: Siemens PLC agent ─────────────────────────────────────────────
  siemens-agent:
    build:
      context: .
      dockerfile: agents/siemens-agent/Dockerfile
    container_name: siemens-agent
    restart: unless-stopped
    networks: [ot-health-net]
    env_file: .env
    environment:
      - API_URL=http://health-api:8000
    depends_on:
      influxdb:
        condition: service_healthy
      api:
        condition: service_started

  # ── SCADA tag agent ────────────────────────────────────────────────────────
  scada-agent:
    build:
      context: .
      dockerfile: agents/scada-agent/Dockerfile
    container_name: scada-agent
    restart: unless-stopped
    networks: [ot-health-net]
    env_file: .env
    environment:
      - API_URL=http://health-api:8000
    depends_on:
      influxdb:
        condition: service_healthy
      api:
        condition: service_started

