<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEA Health Status — Gestión</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-gray-900 text-white px-6 py-4 flex items-center gap-3 shadow">
    <div class="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></div>
    <span class="font-semibold tracking-wide">GEA Control System Health Status</span>
    <span class="ml-auto text-gray-400 text-sm">Gestión de targets</span>
    <a href="/docs" target="_blank" class="text-gray-400 text-sm hover:text-white ml-4">API docs →</a>
  </header>

  <main class="max-w-5xl mx-auto p-6 space-y-6">

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-4">
      <div class="bg-white rounded-lg shadow p-4 text-center">
        <div id="stat-total" class="text-3xl font-bold text-gray-700">—</div>
        <div class="text-sm text-gray-500 mt-1">Total targets</div>
      </div>
      <div class="bg-white rounded-lg shadow p-4 text-center">
        <div id="stat-active" class="text-3xl font-bold text-green-600">—</div>
        <div class="text-sm text-gray-500 mt-1">Activos</div>
      </div>
      <div class="bg-white rounded-lg shadow p-4 text-center">
        <div id="stat-inactive" class="text-3xl font-bold text-gray-400">—</div>
        <div class="text-sm text-gray-500 mt-1">Inactivos</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="flex justify-between items-center">
      <h2 class="font-medium text-gray-700">Targets configurados</h2>
      <button onclick="openModal()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium transition">
        + Añadir target
      </button>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500 text-xs uppercase border-b">
          <tr>
            <th class="px-4 py-3 text-left">Nombre</th>
            <th class="px-4 py-3 text-left">Tipo</th>
            <th class="px-4 py-3 text-left">Host / IP</th>
            <th class="px-4 py-3 text-left">Planta</th>
            <th class="px-4 py-3 text-left">Estado</th>
            <th class="px-4 py-3 text-left">Acciones</th>
          </tr>
        </thead>
        <tbody id="targets-tbody">
          <tr><td colspan="6" class="text-center text-gray-400 py-10">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg">
      <div class="px-6 py-4 border-b flex justify-between items-center">
        <h3 class="font-semibold text-gray-800">Añadir target de monitorización</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
      </div>

      <form id="add-form" onsubmit="submitTarget(event)" class="px-6 py-4 space-y-3">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Nombre</label>
            <input id="f-display_name" type="text" required placeholder="PC Línea 1"
              class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Planta / Site</label>
            <input id="f-plant" type="text" required placeholder="Valencia"
              class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Tipo de agente</label>
          <select id="f-agent_type" onchange="updateFields()"
            class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="server">server — Windows (SNMP / WinRM)</option>
            <option value="siemens">siemens — PLC Siemens (OPC UA / Snap7)</option>
            <option value="scada">scada — OPC UA tags</option>
          </select>
        </div>

        <!-- SERVER fields -->
        <div id="fields-server" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Hostname / IP</label>
              <input id="f-hostname" type="text" placeholder="192.168.1.100"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Método</label>
              <select id="f-collection_method" onchange="updateFields()"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="snmp">SNMP</option>
                <option value="winrm">WinRM</option>
                <option value="vmware">VMware / ESXi</option>
              </select>
            </div>
          </div>
          <div id="snmp-fields" class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Comunidad SNMP</label>
              <input id="f-snmp_community" type="text" value="public"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Puerto SNMP</label>
              <input id="f-snmp_port" type="number" value="161"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div id="vmware-fields" class="hidden space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Usuario</label>
                <input id="f-vmware_user" type="text" placeholder="root"
                  class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Contraseña</label>
                <input id="f-vmware_password" type="password"
                  class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
              <input id="f-vmware_ignore_ssl" type="checkbox" checked class="rounded">
              Ignorar certificado SSL (self-signed)
            </label>
          </div>
        </div>

        <!-- SCADA fields -->
        <div id="fields-scada" class="hidden space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">OPC UA URL</label>
            <input id="f-scada_opcua_url" type="text" placeholder="opc.tcp://10.0.0.1:4840"
              class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Usuario OPC UA</label>
              <input id="f-scada_username" type="text"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Contraseña OPC UA</label>
              <input id="f-scada_password" type="password"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Tipo SCADA</label>
              <select id="f-scada_type"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="auto">Auto</option>
                <option value="Ignition">Ignition</option>
                <option value="WinCC">WinCC</option>
                <option value="FactoryTalk">FactoryTalk</option>
                <option value="AVEVA">AVEVA</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Timeout (segundos)</label>
              <input id="f-scada_timeout" type="number" value="10" min="1"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Tags (uno por línea: nombre,node_id)</label>
            <textarea id="f-scada_tags" rows="4" placeholder="Temperature,ns=2;s=Line1.Temp&#10;Running,ns=2;s=Line1.Running"
              class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
        </div>

        <!-- SIEMENS fields -->
        <div id="fields-siemens" class="hidden space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Método de conexión</label>
            <select id="f-plc_method" onchange="updateFields()"
              class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="auto">Auto (OPC UA → Snap7 fallback)</option>
              <option value="opcua">OPC UA</option>
              <option value="snap7">Snap7</option>
            </select>
          </div>
          <div id="opcua-fields">
            <label class="block text-xs font-medium text-gray-600 mb-1">OPC UA URL</label>
            <input id="f-opcua_url" type="text" placeholder="opc.tcp://10.0.0.1:4840"
              class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div id="snap7-fields" class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Snap7 Host</label>
              <input id="f-snap7_host" type="text" placeholder="10.0.0.1"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Rack</label>
              <input id="f-snap7_rack" type="number" value="0"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Slot</label>
              <input id="f-snap7_slot" type="number" value="1"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Intervalo de polling (segundos)</label>
          <input id="f-poll_interval" type="number" value="30" min="10"
            class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div id="form-error" class="hidden text-red-600 text-sm bg-red-50 rounded p-2"></div>

      </form>

      <div class="px-6 py-4 border-t flex justify-end gap-3">
        <button type="button" onclick="closeModal()"
          class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancelar</button>
        <button type="submit" form="add-form"
          class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded text-sm font-medium transition">
          Guardar
        </button>
      </div>
    </div>
  </div>

  <script>
    const AGENT_TYPE_LABELS = { server: 'server', siemens: 'siemens', scada: 'scada', rockwell: 'rockwell', network: 'network' };
    const TYPE_COLORS = { server: 'bg-blue-100 text-blue-700', siemens: 'bg-purple-100 text-purple-700', scada: 'bg-green-100 text-green-700', rockwell: 'bg-orange-100 text-orange-700', network: 'bg-teal-100 text-teal-700' };

    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(path, opts);
      if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: r.statusText }));
        throw new Error(err.detail || r.statusText);
      }
      return r.status === 204 ? null : r.json();
    }

    async function loadTargets() {
      try {
        const targets = await api('GET', '/config/targets');
        renderStats(targets);
        renderTable(targets);
      } catch (e) {
        document.getElementById('targets-tbody').innerHTML =
          `<tr><td colspan="6" class="text-center text-red-500 py-10">Error cargando targets: ${e.message}</td></tr>`;
      }
    }

    function renderStats(targets) {
      document.getElementById('stat-total').textContent = targets.length;
      document.getElementById('stat-active').textContent = targets.filter(t => t.enabled).length;
      document.getElementById('stat-inactive').textContent = targets.filter(t => !t.enabled).length;
    }

    function getHost(target) {
      const c = target.config;
      return c.hostname || c.snap7_host || (c.opcua_url ? c.opcua_url.replace('opc.tcp://', '') : '—');
    }

    function renderTable(targets) {
      const tbody = document.getElementById('targets-tbody');
      if (!targets.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-gray-400 py-12">
          No hay targets. Añade el primero con "+ Añadir target".</td></tr>`;
        return;
      }
      tbody.innerHTML = targets.map(t => `
        <tr class="border-t hover:bg-gray-50 ${t.enabled ? '' : 'opacity-50'}">
          <td class="px-4 py-3 font-medium">${t.display_name}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-0.5 rounded text-xs font-medium ${TYPE_COLORS[t.agent_type] || 'bg-gray-100 text-gray-600'}">
              ${t.agent_type}
            </span>
          </td>
          <td class="px-4 py-3 font-mono text-xs text-gray-600">${getHost(t)}</td>
          <td class="px-4 py-3 text-gray-600">${t.plant}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${t.enabled ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">
              ${t.enabled ? 'activo' : 'inactivo'}
            </span>
          </td>
          <td class="px-4 py-3 flex gap-2">
            <button onclick="toggleTarget('${t.id}', ${t.enabled})"
              class="text-xs px-2 py-1 rounded border hover:bg-gray-100 text-gray-600">
              ${t.enabled ? 'Pausar' : 'Activar'}
            </button>
            <button onclick="deleteTarget('${t.id}', '${t.display_name}')"
              class="text-xs px-2 py-1 rounded border border-red-200 text-red-600 hover:bg-red-50">
              Eliminar
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function toggleTarget(id, currentlyEnabled) {
      try {
        await api('PUT', `/config/targets/${id}`, { enabled: !currentlyEnabled });
        loadTargets();
      } catch (e) { alert('Error: ' + e.message); }
    }

    async function deleteTarget(id, name) {
      if (!confirm(`¿Eliminar "${name}"? El agente dejará de monitorizar este target.`)) return;
      try {
        await api('DELETE', `/config/targets/${id}`);
        loadTargets();
      } catch (e) { alert('Error: ' + e.message); }
    }

    function openModal() {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('add-form').reset();
      document.getElementById('form-error').classList.add('hidden');
      updateFields();
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function updateFields() {
      const agentType = document.getElementById('f-agent_type').value;
      const method = document.getElementById('f-collection_method').value;
      const plcMethod = document.getElementById('f-plc_method').value;

      document.getElementById('fields-server').classList.toggle('hidden', agentType !== 'server');
      document.getElementById('fields-siemens').classList.toggle('hidden', agentType !== 'siemens');
      document.getElementById('fields-scada').classList.toggle('hidden', agentType !== 'scada');
      document.getElementById('snmp-fields').classList.toggle('hidden', method !== 'snmp');
      document.getElementById('vmware-fields').classList.toggle('hidden', method !== 'vmware');
      document.getElementById('opcua-fields').classList.toggle('hidden', plcMethod === 'snap7');
      document.getElementById('snap7-fields').classList.toggle('hidden', plcMethod === 'opcua');
    }

    function buildId(displayName, plant) {
      return (plant + '-' + displayName).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    async function submitTarget(e) {
      e.preventDefault();
      const errEl = document.getElementById('form-error');
      errEl.classList.add('hidden');

      const agentType = document.getElementById('f-agent_type').value;
      const displayName = document.getElementById('f-display_name').value.trim();
      const plant = document.getElementById('f-plant').value.trim();
      const pollInterval = parseInt(document.getElementById('f-poll_interval').value) || 30;

      let config = { poll_interval_seconds: pollInterval };

      if (agentType === 'server') {
        const hostname = document.getElementById('f-hostname').value.trim();
        if (!hostname) { showError('El hostname es obligatorio.'); return; }
        const method = document.getElementById('f-collection_method').value;
        config = { ...config, hostname, collection_method: method };
        if (method === 'snmp') {
          config.snmp_community = document.getElementById('f-snmp_community').value.trim() || 'public';
          config.snmp_port = parseInt(document.getElementById('f-snmp_port').value) || 161;
          config.snmp_version = '2c';
        } else if (method === 'vmware') {
          config.host = hostname;
          config.user = document.getElementById('f-vmware_user').value.trim();
          config.password = document.getElementById('f-vmware_password').value;
          config.ignore_ssl = document.getElementById('f-vmware_ignore_ssl').checked;
          if (!config.user) { showError('El usuario de VMware es obligatorio.'); return; }
        }
      } else if (agentType === 'siemens') {
        const plcMethod = document.getElementById('f-plc_method').value;
        config = { ...config, collection_method: plcMethod };
        if (plcMethod !== 'snap7') config.opcua_url = document.getElementById('f-opcua_url').value.trim();
        if (plcMethod !== 'opcua') {
          config.snap7_host = document.getElementById('f-snap7_host').value.trim();
          config.snap7_rack = parseInt(document.getElementById('f-snap7_rack').value) || 0;
          config.snap7_slot = parseInt(document.getElementById('f-snap7_slot').value) || 1;
        }
      } else if (agentType === 'scada') {
        const opcuaUrl = document.getElementById('f-scada_opcua_url').value.trim();
        if (!opcuaUrl) { showError('La URL OPC UA es obligatoria.'); return; }
        const tags = document.getElementById('f-scada_tags').value.split('\n')
          .map(line => line.trim()).filter(Boolean).map(line => {
            const [name, ...nodeParts] = line.split(',');
            return { name: name.trim(), node_id: nodeParts.join(',').trim() };
          });
        if (!tags.length || tags.some(t => !t.name || !t.node_id)) { showError('Añade al menos un tag válido: nombre,node_id.'); return; }
        config = {
          ...config,
          opcua_url: opcuaUrl,
          username: document.getElementById('f-scada_username').value.trim() || null,
          password: document.getElementById('f-scada_password').value || null,
          scada_type: document.getElementById('f-scada_type').value,
          timeout_seconds: parseInt(document.getElementById('f-scada_timeout').value) || 10,
          tags,
        };
      }

      const payload = {
        id: buildId(displayName, plant),
        display_name: displayName,
        plant,
        agent_type: agentType,
        config,
      };

      try {
        await api('POST', '/config/targets', payload);
        closeModal();
        loadTargets();
      } catch (e) {
        showError(e.message);
      }
    }

    function showError(msg) {
      const el = document.getElementById('form-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // Close modal on backdrop click
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    loadTargets();
  </script>
</body>
</html>
